[package]
name = "cardano-adapter"
version = "0.1.0"
edition = "2021"
description = "Cardano blockchain"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
reqwest = { version = "0.11", features = ["json"] }
tracing = "0.1"
tracing-subscriber = "0.3"
hex = "0.4"
blake2 = "0.10"
sha2 = "0.10"
bech32 = "0.9"
cardano-hash-derive = "0.1"
cardano-address = "0.3"

[dev-dependencies]
tokio-test = "0.4"
