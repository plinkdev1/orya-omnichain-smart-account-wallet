[package]
name = "cosmos-adapter"
version = "0.1.0"
edition = "2021"
description = "Cosmos SDK ecosystem adapter for ORŸA Wallet"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
reqwest = { version = "0.11", features = ["json"] }
tracing = "0.1"
tracing-subscriber = "0.3"

# Cosmos SDK
cosmrs = "0.15"
cosmos-sdk-proto = "0.19"
tendermint = "0.33"
tendermint-proto = "0.33"

# Cryptography
sha2 = "0.10"
ripemd = "0.1"
secp256k1 = { version = "0.27", features = ["recovery", "serde"] }
ed25519-zebra = "3.1"

# Key derivation
bip32 = "0.5"
bip39 = "2.0"

# Serialization
base64 = "0.21"
hex = "0.4"

# HTTP
hyper = "0.14"

# Utilities
bytes = "1.5"
num-bigint = "0.4"
rand = "0.8"
uuid = { version = "1.6", features = ["v4", "serde"] }

[dev-dependencies]
tokio-test = "0.4"
