version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: orya_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: orya_user
      POSTGRES_PASSWORD: dev_password_123
      POSTGRES_DB: orya_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orya_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orya_network

  # Redis Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: orya_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass jBopsYibO4uJLLOakCWxnRrW0sIK2oH5
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orya_network

  # Optional: pgAdmin for PostgreSQL management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: orya_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@orya.io
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - orya_network

  # Optional: Redis Commander for Redis management
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: orya_redis_commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379:0:jBopsYibO4uJLLOakCWxnRrW0sIK2oH5
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - orya_network

volumes:
  postgres_data:
  redis_data:

networks:
  orya_network:
    driver: bridge
