syntax = "proto3";

package chainbase;

service Chainbase {
    rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
    rpc GetTransactions(GetTransactionsRequest) returns (GetTransactionsResponse);
    rpc GetTVL(GetTVLRequest) returns (GetTVLResponse);
    rpc GetAnalytics(GetAnalyticsRequest) returns (GetAnalyticsResponse);
    rpc ListChains(ListChainsRequest) returns (ListChainsResponse);
    rpc SyncData(SyncDataRequest) returns (SyncDataResponse);
}

message GetBalanceRequest {
    string address = 1;
    string chain_id = 2;
    bool include_tokens = 3;
}

message GetBalanceResponse {
    Balance balance = 1;
    repeated Token tokens = 2;
}

message Balance {
    string chain_id = 1;
    string address = 2;
    string balance = 3;
    int32 decimals = 4;
    string symbol = 5;
    int64 last_updated = 6;
}

message Token {
    string address = 1;
    string chain_id = 2;
    string symbol = 3;
    string name = 4;
    int32 decimals = 5;
    string balance = 6;
    optional double price_usd = 7;
    optional string logo = 8;
}

message GetTransactionsRequest {
    string address = 1;
    string chain_id = 2;
    uint32 limit = 3;
    uint32 offset = 4;
}

message GetTransactionsResponse {
    repeated Transaction transactions = 1;
    int32 total = 2;
    bool has_more = 3;
}

message Transaction {
    string hash = 1;
    string chain_id = 2;
    string from = 3;
    string to = 4;
    string value = 5;
    int64 timestamp = 6;
    string status = 7;
    int64 block_number = 8;
    optional string gas_used = 9;
    optional string gas_price = 10;
}

message GetTVLRequest {
    string chain_id = 1;
    string protocol = 2;
}

message GetTVLResponse {
    string protocol = 1;
    string chain_id = 2;
    string tvl = 3;
    double tvl_usd = 4;
    int64 timestamp = 5;
}

message GetAnalyticsRequest {
    string address = 1;
    string chain_id = 2;
}

message GetAnalyticsResponse {
    string chain_id = 1;
    string address = 2;
    int32 total_transactions = 3;
    string total_value = 4;
    int64 first_transaction = 5;
    int64 last_transaction = 6;
    int32 unique_contracts = 7;
}

message ListChainsRequest {}

message ListChainsResponse {
    repeated ChainInfo chains = 1;
}

message ChainInfo {
    string chain_id = 1;
    string name = 2;
    bool is_testnet = 3;
    bool is_supported = 4;
}

message SyncDataRequest {
    string chain_id = 1;
    string address = 2;
}

message SyncDataResponse {
    bool success = 1;
}
